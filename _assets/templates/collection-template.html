<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Collection Name] - Physics of Faith</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0a0e14;
            --bg-card: #121820;
            --border: rgba(139, 92, 246, 0.2);
            --text: #e0e6ed;
            --text-dim: #a0a8b0;
            --accent1: #8b5cf6;
            --accent2: #06b6d4;
            --accent3: #fbbf24;
            --glow: rgba(139, 92, 246, 0.3);
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        
        header {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(6, 182, 212, 0.1));
            border-bottom: 2px solid var(--border);
            padding: 2rem;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        
        .subtitle { color: var(--accent3); }
        
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .card:hover {
            border-color: var(--accent1);
            box-shadow: 0 0 20px var(--glow);
            transform: translateY(-4px);
        }
        
        .card h3 {
            color: var(--accent2);
            margin-bottom: 0.75rem;
        }
        
        .card p {
            color: var(--text-dim);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<header>
    <h1>[Collection Name]</h1>
    <p class="subtitle">[Collection subtitle/description]</p>
</header>

<main>
    <section>
        <h2 style="color: var(--accent1); margin-bottom: 1.5rem;">[Section Title]</h2>
        <div class="grid">
            <!-- Card Template -->
            <div class="card" onclick="window.location.href='[link]'">
                <h3>[Card Title]</h3>
                <p>[Card description]</p>
            </div>
            
            <!-- Add more cards as needed -->
        </div>
    </section>
</main>

<footer style="text-align: center; padding: 2rem; border-top: 1px solid var(--border); margin-top: 4rem;">
    <p>
        <a href="../../index.html" style="color: var(--accent2);">← Back to Gallery</a>
    </p>
</footer>

</body>
</html>
